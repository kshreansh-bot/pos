[alembic]
script_location = migrations
prepend_sys_path = .
run_online = online
run_offline = offline

[post_write_hooks]
hooks = black

[logging]
version = 1
formatters =
    standard =
        format = %(asctime)s %(levelname)s %(message)s
    simple =
        format = %(asctime)s %(levelname)s %(message)s
loggers =
    alembic =
        level = INFO
handlers =
    console =
        class = logging.StreamHandler
        args = (sys.stderr,)
        level = NOTSET
        formatter = standard
root =
    level = INFO
    handlers = console
    formatter = standard